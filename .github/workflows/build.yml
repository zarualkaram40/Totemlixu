name: Build TotemGuard

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Paper 1.21.11
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build plugin
        run: mvn --batch-mode clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: TotemGuard-Paper-1.21.11
          path: target/*.jar
          if-no-files-found: error
